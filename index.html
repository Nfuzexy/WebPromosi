<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS AuliaSoft</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #0033FF;
  --blue-dark: #001FCC;
  --blue-mid: #0044FF;
  --neon: #BBFF00;
  --white: #FFFFFF;
  --glass: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.18);
  --card-bg: rgba(255,255,255,0.92);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--blue);
  color:var(--white);
  overflow-x:hidden;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--blue-dark)}
::-webkit-scrollbar-thumb{background:var(--neon);border-radius:3px}

/* ─── NAV ─── */
nav{
  position:fixed;top:0;left:0;width:100%;z-index:999;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 40px;
  background:rgba(0,33,255,0.85);
  backdrop-filter:blur(16px);
  border-bottom:1.5px solid rgba(255,255,255,0.12);
}
.nav-logo{
  display:flex;align-items:center;gap:10px;
  background:var(--white);border-radius:30px;padding:6px 18px;
}
.nav-logo img{height:28px}
.nav-logo span{font-family:'Bebas Neue';font-size:22px;color:var(--blue);letter-spacing:1px}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-links a{
  color:rgba(255,255,255,0.75);font-size:13px;font-weight:500;
  text-decoration:none;padding:5px 12px;border-radius:20px;
  transition:.2s;border:1.5px solid transparent;
}
.nav-links a:hover{color:#fff;border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.08)}
.btn-cta{
  background:var(--neon);color:var(--blue);font-weight:700;font-size:13px;
  border:none;border-radius:30px;padding:9px 22px;cursor:pointer;
  text-decoration:none;letter-spacing:.5px;transition:.2s;
  font-family:'Space Grotesk',sans-serif;
}
.btn-cta:hover{background:#d4ff00;transform:scale(1.04)}

/* ─── HERO ─── */
#beranda{
  min-height:100vh;
  padding:130px 40px 80px;
  position:relative;overflow:hidden;
  background:var(--blue);
  display:flex;align-items:center;
}
.hero-grid-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:60px 60px;
}
.hero-noise{
  position:absolute;inset:0;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px;
}
.hero-inner{position:relative;z-index:2;max-width:1200px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero-text{}
.hero-hashtag{
  display:inline-block;font-family:'Bebas Neue';font-size:22px;
  color:var(--neon);letter-spacing:2px;margin-bottom:16px;
}
.hero-title{
  font-family:'Bebas Neue';
  font-size:clamp(72px,9vw,130px);
  line-height:.92;
  color:var(--white);
  letter-spacing:-2px;
}
.hero-title .neon-word{color:var(--neon);display:block}
.hero-subtitle{
  margin-top:24px;font-size:17px;line-height:1.6;
  color:rgba(255,255,255,.8);max-width:480px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);
  border-radius:30px;padding:8px 18px;margin-top:20px;font-size:14px;font-weight:500;
}
.hero-badge span{color:var(--neon)}
.hero-buttons{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.btn-primary{
  background:var(--neon);color:var(--blue);
  font-weight:800;font-size:15px;border:none;border-radius:30px;
  padding:14px 32px;cursor:pointer;text-decoration:none;
  font-family:'Space Grotesk',sans-serif;letter-spacing:.3px;
  transition:.25s;display:inline-flex;align-items:center;gap:8px;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(187,255,0,.35)}
.btn-outline{
  background:transparent;color:var(--white);
  font-weight:600;font-size:15px;border:2px solid rgba(255,255,255,.35);
  border-radius:30px;padding:14px 32px;cursor:pointer;text-decoration:none;
  font-family:'Space Grotesk',sans-serif;transition:.25s;
}
.btn-outline:hover{border-color:var(--white);background:rgba(255,255,255,.08)}

/* floating cards */
.hero-visual{position:relative;height:440px;display:flex;align-items:center;justify-content:center}
.float-card{
  position:absolute;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  border:1.5px solid rgba(255,255,255,0.22);
  border-radius:20px;
  padding:18px 22px;
  min-width:170px;
  animation:floatCard 4s ease-in-out infinite;
}
.float-card:nth-child(2){animation-delay:-1.5s}
.float-card:nth-child(3){animation-delay:-3s}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.fc1{top:20px;left:0}
.fc2{top:130px;right:0;animation-delay:-1.5s!important}
.fc3{bottom:20px;left:60px;animation-delay:-3s!important}
.fc-label{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:4px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.fc-value{font-family:'Bebas Neue';font-size:30px;color:var(--neon);letter-spacing:1px}
.fc-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.hero-big-num{
  font-family:'Bebas Neue';font-size:180px;
  color:rgba(255,255,255,.04);
  position:absolute;right:-20px;bottom:-40px;
  line-height:1;pointer-events:none;letter-spacing:-8px;
}
.stamp{
  position:absolute;bottom:40px;right:0;
  width:130px;height:130px;border-radius:50%;
  background:var(--neon);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:spin 14s linear infinite;
  border:3px solid var(--blue);
}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  animation:spinReverse 14s linear infinite;
}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
.stamp span{font-family:'Bebas Neue';font-size:12px;color:var(--blue);letter-spacing:1px;line-height:1.2}
.stamp .stamp-big{font-size:16px}

/* ─── SECTION TITLE ─── */
.section-wrap{padding:100px 40px;position:relative;overflow:hidden}
.section-wrap.alt{background:rgba(0,0,0,.15)}
.section-label{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'DM Mono';font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:var(--neon);margin-bottom:18px;
}
.section-label::before{content:'';display:block;width:20px;height:2px;background:var(--neon)}
.section-title{
  font-family:'Bebas Neue';font-size:clamp(48px,6vw,90px);
  line-height:.92;letter-spacing:-1px;color:var(--white);
  margin-bottom:14px;
}
.section-desc{font-size:16px;color:rgba(255,255,255,.7);max-width:600px;line-height:1.65}

/* ─── FEATURES GRID ─── */
.features-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;margin-top:60px;
}
.feat-card{
  background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:20px;padding:28px;
  transition:.3s;cursor:default;
  position:relative;overflow:hidden;
}
.feat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(187,255,0,.07),transparent);
  opacity:0;transition:.3s;
}
.feat-card:hover{transform:translateY(-6px);border-color:rgba(187,255,0,.35)}
.feat-card:hover::before{opacity:1}
.feat-img{
  width:100%;height:140px;object-fit:cover;
  border-radius:12px;margin-bottom:18px;
  border:1px solid rgba(255,255,255,.1);
}
.feat-icon{
  width:42px;height:42px;border-radius:12px;
  background:var(--neon);display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:14px;
}
.feat-name{font-family:'Bebas Neue';font-size:24px;letter-spacing:.5px;margin-bottom:8px}
.feat-desc{font-size:14px;color:rgba(255,255,255,.65);line-height:1.55}

/* ─── TARGET ─── */
.target-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:60px}
.target-card{
  background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:20px;padding:30px 26px;
  transition:.3s;
}
.target-card:hover{border-color:var(--neon);background:rgba(187,255,0,.06);transform:translateY(-5px)}
.target-icon{font-size:38px;margin-bottom:16px}
.target-name{font-family:'Bebas Neue';font-size:26px;margin-bottom:10px;letter-spacing:.5px}
.target-desc{font-size:14px;color:rgba(255,255,255,.65);line-height:1.6}

/* ─── TESTIMONI ─── */
.testi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:60px}
.testi-card{
  background:rgba(255,255,255,0.09);
  border:1.5px solid rgba(255,255,255,.14);
  border-radius:20px;padding:28px;
  transition:.3s;
}
.testi-card:hover{transform:translateY(-4px);border-color:rgba(187,255,0,.3)}
.testi-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.testi-img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--neon)}
.testi-name{font-weight:700;font-size:15px}
.testi-type{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.stars{color:var(--neon);font-size:14px;margin-bottom:10px;letter-spacing:2px}
.testi-quote{font-weight:700;font-size:15px;margin-bottom:8px}
.testi-text{font-size:14px;color:rgba(255,255,255,.65);line-height:1.55}

/* ─── PRICING ─── */
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:60px}
.promo-banner{
  background:rgba(187,255,0,.12);border:1.5px solid rgba(187,255,0,.3);
  border-radius:16px;padding:16px 24px;margin-top:30px;
  display:inline-flex;align-items:center;gap:10px;font-size:15px;
}
.promo-banner span{color:var(--neon);font-weight:700}
.price-card{
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:24px;padding:34px 28px;
  position:relative;transition:.3s;
}
.price-card.popular{
  background:var(--neon);border-color:var(--neon);
  color:var(--blue);
}
.price-card:hover:not(.popular){border-color:var(--neon);transform:translateY(-6px)}
.price-badge{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  background:var(--blue);color:var(--neon);
  font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:5px 16px;border-radius:30px;border:2px solid var(--neon);
  white-space:nowrap;
}
.price-name{font-family:'Bebas Neue';font-size:36px;letter-spacing:1px;margin-bottom:8px}
.price-amount{font-family:'Bebas Neue';font-size:52px;line-height:1;margin-bottom:4px;letter-spacing:-1px}
.price-period{font-size:13px;opacity:.7;margin-bottom:24px}
.price-features{list-style:none;margin-bottom:28px;display:flex;flex-direction:column;gap:10px}
.price-features li{font-size:14px;display:flex;align-items:center;gap:9px}
.price-features li::before{content:'✓';font-weight:700;color:var(--neon);font-size:13px}
.popular .price-features li::before{color:var(--blue)}
.btn-price{
  display:block;width:100%;text-align:center;padding:14px;
  border-radius:30px;font-weight:700;font-size:15px;text-decoration:none;
  font-family:'Space Grotesk',sans-serif;transition:.2s;
  border:2px solid var(--white);color:var(--white);background:transparent;
}
.btn-price:hover{background:var(--white);color:var(--blue)}
.popular .btn-price{background:var(--blue);color:var(--neon);border-color:var(--blue)}
.popular .btn-price:hover{background:var(--blue-dark)}

/* ─── PRODUK PENDUKUNG ─── */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:60px}
.prod-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:20px;padding:28px;text-align:center;transition:.3s;
}
.prod-card:hover{border-color:var(--neon);transform:translateY(-5px)}
.prod-img{width:100%;height:120px;object-fit:contain;margin-bottom:16px}
.prod-name{font-family:'Bebas Neue';font-size:22px;margin-bottom:8px;letter-spacing:.5px}
.prod-desc{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:14px;line-height:1.5}
.prod-price{
  display:inline-block;background:var(--neon);color:var(--blue);
  font-weight:700;font-size:14px;border-radius:20px;padding:5px 16px;
}

/* ─── PANDUAN ─── */
.panduan-inner{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;margin-top:60px}
.panduan-img{width:100%;border-radius:20px;border:1.5px solid rgba(255,255,255,.15)}
.panduan-text{font-size:16px;line-height:1.75;color:rgba(255,255,255,.8)}

/* ─── FAQ ─── */
.faq-list{margin-top:60px;display:flex;flex-direction:column;gap:16px;max-width:800px}
.faq-item{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:16px;padding:22px 26px;cursor:pointer;
  transition:.3s;
}
.faq-item:hover{border-color:var(--neon)}
.faq-q{font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.faq-q::after{content:'+';font-size:22px;color:var(--neon);flex-shrink:0;transition:.3s}
.faq-item.open .faq-q::after{content:'−'}
.faq-a{display:none;font-size:14px;color:rgba(255,255,255,.65);margin-top:14px;line-height:1.65}
.faq-item.open .faq-a{display:block}

/* ─── ROADMAP ─── */
.roadmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:60px}
.road-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:20px;padding:30px;transition:.3s;
}
.road-card:hover{border-color:var(--neon);transform:translateY(-4px)}
.road-version{font-family:'Bebas Neue';font-size:42px;color:var(--neon);letter-spacing:1px;margin-bottom:14px}
.road-desc{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:20px;line-height:1.6}
.road-list{list-style:none;display:flex;flex-direction:column;gap:9px}
.road-list li{font-size:13.5px;color:rgba(255,255,255,.75);display:flex;align-items:flex-start;gap:9px;line-height:1.4}
.road-list li::before{content:'→';color:var(--neon);font-weight:700;flex-shrink:0;margin-top:1px}

/* ─── TENTANG / SEKTOR ─── */
.about-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-top:50px}
.about-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:18px;padding:26px;text-align:center;transition:.3s;
}
.about-card:hover{border-color:var(--neon);transform:translateY(-4px)}
.about-icon{font-size:38px;margin-bottom:14px}
.about-name{font-family:'Bebas Neue';font-size:22px;letter-spacing:.5px;margin-bottom:8px}
.about-desc{font-size:13px;color:rgba(255,255,255,.6);line-height:1.55}

/* ─── KUSTOMISASI ─── */
.kustom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:60px}
.kustom-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:18px;padding:26px;transition:.3s;
}
.kustom-card:hover{border-color:var(--neon);transform:translateY(-4px)}
.kustom-icon{font-size:32px;margin-bottom:14px}
.kustom-name{font-weight:700;font-size:16px;margin-bottom:8px}
.kustom-desc{font-size:14px;color:rgba(255,255,255,.6);line-height:1.55}

/* ─── KOMPETITOR ─── */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:60px}
.comp-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:20px;padding:30px;
}
.comp-card.ours{border-color:var(--neon);background:rgba(187,255,0,.06)}
.comp-name{font-family:'Bebas Neue';font-size:34px;margin-bottom:20px;letter-spacing:.5px}
.comp-card.ours .comp-name{color:var(--neon)}
.comp-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.comp-list li{font-size:14px;color:rgba(255,255,255,.75);display:flex;align-items:flex-start;gap:9px;line-height:1.4}
.comp-list li::before{content:'✓';color:var(--neon);font-weight:700;flex-shrink:0}
.comp-card:not(.ours) .comp-list li::before{content:'◉';color:rgba(255,255,255,.35)}

/* ─── LAYANAN ─── */
.layanan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:60px}
.layanan-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:18px;padding:26px;text-align:center;transition:.3s;
}
.layanan-card:hover{border-color:var(--neon);transform:translateY(-4px)}
.layanan-icon{font-size:38px;margin-bottom:14px}
.layanan-name{font-family:'Bebas Neue';font-size:24px;margin-bottom:8px;letter-spacing:.5px}
.layanan-desc{font-size:14px;color:rgba(255,255,255,.6);line-height:1.55}

/* ─── PROSES ─── */
.proses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:60px}
.proses-card{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:18px;padding:28px;transition:.3s;
}
.proses-card:hover{border-color:var(--neon);transform:translateY(-4px)}
.proses-num{font-family:'Bebas Neue';font-size:64px;color:rgba(187,255,0,.2);line-height:1;margin-bottom:10px}
.proses-icon{font-size:30px;margin-bottom:12px}
.proses-name{font-weight:700;font-size:16px;margin-bottom:8px}
.proses-desc{font-size:14px;color:rgba(255,255,255,.6);line-height:1.55}

/* ─── KONTAK ─── */
#kontak{background:rgba(0,0,0,.2)}
.kontak-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:60px;align-items:start}
.kontak-info{display:flex;flex-direction:column;gap:22px}
.kontak-item{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:16px;padding:20px 24px;
}
.kontak-item h4{font-weight:700;font-size:13px;color:var(--neon);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.kontak-item a,.kontak-item p{font-size:15px;color:rgba(255,255,255,.85);text-decoration:none;line-height:1.55}
.kontak-item a:hover{color:var(--neon)}
.kontak-badge{margin-top:20px;background:rgba(187,255,0,.1);border:1.5px solid rgba(187,255,0,.25);border-radius:16px;padding:22px}
.kontak-badge h4{font-family:'Bebas Neue';font-size:20px;color:var(--neon);margin-bottom:14px;letter-spacing:.5px}
.kontak-badge ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.kontak-badge li{font-size:14px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px}
.kontak-badge li::before{content:'✓';color:var(--neon);font-weight:700}
.konsultasi-form{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:24px;padding:34px}
.konsultasi-form h3{font-family:'Bebas Neue';font-size:32px;margin-bottom:24px;letter-spacing:.5px}
.form-label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.form-group{margin-bottom:20px}
.btn-group{display:flex;flex-wrap:wrap;gap:10px}
.btn-bisnis{
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);
  color:var(--white);font-size:14px;font-weight:600;border-radius:30px;
  padding:9px 20px;cursor:pointer;font-family:'Space Grotesk',sans-serif;
  transition:.2s;
}
.btn-bisnis:hover,.btn-bisnis.active{background:var(--neon);color:var(--blue);border-color:var(--neon)}
.btn-submit{
  width:100%;background:var(--neon);color:var(--blue);
  font-weight:700;font-size:15px;border:none;border-radius:30px;
  padding:15px;cursor:pointer;font-family:'Space Grotesk',sans-serif;
  margin-top:8px;transition:.2s;
}
.btn-submit:hover{background:#d4ff00;transform:translateY(-2px)}
